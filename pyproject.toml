[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-repro"
version = "0.1.0"
description = "Reproducing the evaluation of Whisper (Radford et al., ICML 2023) — COMP8240"
requires-python = ">=3.10"
dependencies = [
    "openai-whisper==20250625",
    "jiwer==3.0",
    "soundfile==0.12",
    "numpy==1.24",
    "datasets==2.14",
    "PyYAML==6.0",
    "soxr==0.3",
    "boto3==1.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
whisper-repro = "whisper_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
